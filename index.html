<!doctype html>
<!--
THESIS: Una órbita de luz, no un hero convencional: el gesto de tocar enciende la celebración.
OWN-WORLD: Negro de observatorio, ámbar solar, naranja eclipse y verde hoja; SVG orgánico + grano estelar.
STORY: La persona descubre una flor, la activa y queda dentro de un pequeño universo de buenos deseos.
FIRST VIEWPORT: Girasol centrado, título arriba y frases orbitando sin tapar el núcleo; la acción vive en el gesto.
FORM: Experiencia inmersiva de una sola escena, responsive-first, con una entrada calma y una expansión luminosa.
-->
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#030201" />
    <meta name="description" content="Una experiencia visual de luz dorada para celebrar el Día de las Flores Amarillas." />
    <title>Flores amarillas · una órbita de luz</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="experience" id="experience">
      <canvas class="stars" id="stars" aria-hidden="true"></canvas>
      <div class="aurora" aria-hidden="true"></div>

      <section class="opening" id="opening" tabindex="0" aria-label="Inicio de la experiencia">
        <div class="intro-flare" aria-hidden="true"></div>
        <div class="sunflower sunflower--intro" aria-hidden="true">
          <svg viewBox="0 0 320 430" role="img">
            <defs>
              <radialGradient id="petalIntro" cx="35%" cy="22%">
                <stop offset="0" stop-color="#fff3a4" />
                <stop offset=".42" stop-color="#ffd447" />
                <stop offset="1" stop-color="#d98b08" />
              </radialGradient>
              <radialGradient id="seedIntro">
                <stop offset="0" stop-color="#805019" />
                <stop offset=".55" stop-color="#3b210f" />
                <stop offset="1" stop-color="#150d08" />
              </radialGradient>
              <linearGradient id="stemIntro" x1="0" x2="1">
                <stop stop-color="#315b29" />
                <stop offset=".55" stop-color="#6e9b3b" />
                <stop offset="1" stop-color="#1b3b24" />
              </linearGradient>
              <filter id="softGlow"><feGaussianBlur stdDeviation="7" /></filter>
            </defs>
            <ellipse class="flower-shadow" cx="160" cy="397" rx="72" ry="9" />
            <path class="stem" d="M151 256C155 300 149 351 158 408" />
            <path class="leaf leaf--left" d="M153 327C110 288 72 302 51 334C91 351 126 347 154 334Z" />
            <path class="leaf leaf--right" d="M154 365C192 328 233 336 253 367C217 384 184 381 155 371Z" />
            <g class="petals">
              <ellipse class="petal" cx="160" cy="79" rx="25" ry="77" />
              <ellipse class="petal" cx="160" cy="79" rx="25" ry="77" transform="rotate(30 160 160)" />
              <ellipse class="petal" cx="160" cy="79" rx="25" ry="77" transform="rotate(60 160 160)" />
              <ellipse class="petal" cx="160" cy="79" rx="25" ry="77" transform="rotate(90 160 160)" />
              <ellipse class="petal" cx="160" cy="79" rx="25" ry="77" transform="rotate(120 160 160)" />
              <ellipse class="petal" cx="160" cy="79" rx="25" ry="77" transform="rotate(150 160 160)" />
              <ellipse class="petal" cx="160" cy="79" rx="25" ry="77" transform="rotate(180 160 160)" />
              <ellipse class="petal" cx="160" cy="79" rx="25" ry="77" transform="rotate(210 160 160)" />
              <ellipse class="petal" cx="160" cy="79" rx="25" ry="77" transform="rotate(240 160 160)" />
              <ellipse class="petal" cx="160" cy="79" rx="25" ry="77" transform="rotate(270 160 160)" />
              <ellipse class="petal" cx="160" cy="79" rx="25" ry="77" transform="rotate(300 160 160)" />
              <ellipse class="petal" cx="160" cy="79" rx="25" ry="77" transform="rotate(330 160 160)" />
            </g>
            <circle class="seed" cx="160" cy="160" r="58" />
            <circle class="seed-highlight" cx="143" cy="139" r="8" />
          </svg>
        </div>
        <p class="tap-prompt"><span class="tap-dot"></span>Toca para iniciar</p>
        <p class="tap-hint">Una pequeña luz te está esperando</p>
      </section>

      <section class="universe" id="universe" aria-live="polite" aria-label="Celebración de flores amarillas">
        <header class="title-lockup">
          <p class="eyebrow">una órbita para ti</p>
          <h1>Feliz Día de las<br /><em>Flores Amarillas</em> <span aria-hidden="true">🌻</span></h1>
        </header>

        <div class="orbit-stage" id="orbitStage">
          <div class="orbit-halo" aria-hidden="true"></div>
          <div class="planet" aria-hidden="true">
            <div class="planet-light"></div>
            <div class="planet-texture"></div>
          </div>
          <div class="ring ring--back" aria-hidden="true"></div>
          <div class="ring ring--front" aria-hidden="true"></div>
          <div class="sunflower sunflower--hero" aria-hidden="true">
            <svg viewBox="0 0 320 430">
              <use href="#missing" />
            </svg>
          </div>
          <div class="hero-flower" aria-hidden="true"></div>
          <div class="orbit-sparks" id="orbitSparks" aria-hidden="true"></div>
        </div>

        <div class="wish-field" id="wishField" aria-hidden="true"></div>
        <p class="footer-note">que hoy encuentres un poquito más de luz</p>
      </section>

      <div class="touch-ripples" id="touchRipples" aria-hidden="true"></div>
      <button class="replay" id="replay" type="button" aria-label="Volver a ver la experiencia">↻</button>
    </main>
    <script src="script.js"></script>
  </body>
</html>
